{% extends 'base.html' %}
{% block content %}
<div class="container my-5" style="max-width: 700px;">
    <div class="p-4 rounded bg-secondary bg-opacity-10 border border-secondary">
        <h3 class="fw-bold mb-4">{{ action }} Movie Record</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-light">Movie Title *</label>
                <input type="text" name="title" class="form-control bg-dark text-light border-secondary" value="{{ movie.title or '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Genres (Comma separated) *</label>
                <input type="text" name="genres" class="form-control bg-dark text-light border-secondary" placeholder="e.g. Action, Adventure, Sci-Fi" value="{{ movie.genres_display if movie.genres_display is defined else (movie.genres|join(', ') if movie.genres is iterable and movie.genres is not string else (movie.genres or '')) }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Release Date</label>
                <input type="date" name="release_date" class="form-control bg-dark text-light border-secondary" value="{{ movie.release_date or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Overview</label>
                <textarea name="overview" rows="4" class="form-control bg-dark text-light border-secondary">{{ movie.overview or '' }}</textarea>
            </div>
            <div class="d-flex justify-content-between mt-4">
                <a href="{{ url_for('catalog') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger px-4">{{ action }} Movie</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
