{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <h2 class="fw-bold border-start border-danger border-4 ps-3 mb-4">My Watchlist</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        {% for item in items %}
        <div class="col">
            <div class="card h-100 bg-secondary bg-opacity-10 border-secondary">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-light">{{ item.movie.title }}</h5>
                    <span class="badge bg-warning text-dark align-self-start mb-2">{{ item.status }}</span>
                    <p class="card-text text-secondary small flex-grow-1">{{ item.movie.overview[:100] }}...</p>
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary">
                        <a href="{{ url_for('movie_detail', movie_id=item.movie.movie_id) }}" class="btn btn-sm btn-outline-light">Details</a>
                        <form action="{{ url_for('toggle_watchlist', movie_id=item.movie.movie_id) }}" method="POST">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12 py-5 text-center">
            <p class="text-secondary fs-5">Your watchlist is currently empty.</p>
            <a href="{{ url_for('catalog') }}" class="btn btn-danger">Browse Movies</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
